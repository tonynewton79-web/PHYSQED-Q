name: Gate 7 independent PNNL QASMBench multi-seed comparison

on:
  push:
    branches: ["research/gate7-external-qasmbench-multiseed-20261118"]
  pull_request:
    paths:
      - "benchmarks/gate7*"
      - "tests/test_gate7_external.py"
      - ".github/workflows/gate7-qasmbench.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate7:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned external compilers and archived Aer backends
        run: python -m pip install -r benchmarks/requirements-gate3.txt
      - name: Verify external input provenance and rejection boundaries
        run: python -m unittest tests.test_gate7_external -v
      - name: Freeze all 19 independent QASMBench QASM source blobs with SHA
        run: |
          python -c 'from benchmarks.gate7_qasmbench import acquire_sources; acquire_sources("/tmp/qasmbench-frozen")'
      - name: Compare all STRICT admissible source circuits over three seeds and common outputs
        run: |
          python -m benchmarks.gate7_external_compare --source-dir /tmp/qasmbench-frozen --output /tmp/gate7-results.json
      - name: Independently replay 19 source admissions and all physical/noise result ledgers
        run: |
          python -m benchmarks.gate7_audit /tmp/gate7-results.json --output /tmp/gate7-audit.json
      - name: Archive all refusals, source hashes, native operations, seed outputs and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physqed-q-gate7-pnnl-external-multiseed
          path: |
            /tmp/gate7-results.json
            /tmp/gate7-audit.json
          if-no-files-found: warn
