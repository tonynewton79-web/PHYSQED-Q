name: Lean gate identities

on:
  push:
    branches: ["main", "feature/lean-*"]
    paths:
      - "formal/**"
      - "lean-toolchain"
      - ".github/workflows/lean-gates.yml"
  pull_request:
    paths:
      - "formal/**"
      - "lean-toolchain"
      - ".github/workflows/lean-gates.yml"

jobs:
  exact-gate-proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.24.0 (standalone modules)
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --no-modify-path --default-toolchain leanprover/lean4:v4.24.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify Lean version
        run: lean --version
      - name: Compile closed algebraic identities in Lean's kernel
        run: lean formal/GateIdentities.lean
      - name: Reject unproved placeholders and custom axioms
        run: |
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit|native_decide|axiom)([^[:alnum:]_]|$)' formal/GateIdentities.lean; then
            echo 'Unsafe proof construct found.'
            exit 1
          fi
