name: PHYSQED-Q exact compiler

on:
  push:
    branches: ["main", "feature/physqed-q-*", "feature/visual-*", "feature/certified-commutation-*", "feature/bounded-optimality-*"]
    paths:
      - "physqed_q/**"
      - "tests/**"
      - "examples/**"
      - "benchmarks/**"
      - "README.md"
      - "DESIGN.md"
      - ".github/workflows/physqed-q.yml"
  pull_request:
    paths:
      - "physqed_q/**"
      - "tests/**"
      - "examples/**"
      - "benchmarks/**"
      - "README.md"
      - "DESIGN.md"
      - ".github/workflows/physqed-q.yml"

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run exact kernel, adversarial and CLI tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
      - name: Check internal commuting corpus and deterministic JSON
        env:
          PYTHONPATH: .
        run: |
          python -m unittest tests.test_commuting_benchmark -v
          python -m benchmarks.commuting_suite > /tmp/commuting-first.json
          python -m benchmarks.commuting_suite > /tmp/commuting-second.json
          cmp /tmp/commuting-first.json /tmp/commuting-second.json
      - name: Independent CLI replay
        env:
          PYTHONPATH: .
        run: |
          python -m physqed_q compile examples/optimize.json --output /tmp/physqed-q-receipt.json
          python -m physqed_q verify /tmp/physqed-q-receipt.json
          python -m physqed_q compile examples/commuting.json --optimizer commuting --output /tmp/physqed-q-commuting.json
          python -m physqed_q verify /tmp/physqed-q-commuting.json
      - name: Exhaustive bounded optimality tests and independent CLI replay
        env:
          PYTHONPATH: .
        run: |
          python -m unittest tests.test_optimality tests.test_cli -v
          python -m physqed_q synthesize examples/optimality.json --horizon 5 --output /tmp/physqed-q-optimality.json
          python -m physqed_q verify-optimality /tmp/physqed-q-optimality.json

  visual-workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check web editor JavaScript syntax
        run: node --check physqed_q/web_assets/app.js
      - name: Test circuit editor state, optimizer selector and preset race protection
        run: node tests/test_web_ui.mjs
